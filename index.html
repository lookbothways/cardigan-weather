    const od = tiles.get(key); od.state = 'err';
    if (e.status === 429) {                    // rate limited: wait for the window named in the reason, then carry on
      const r = e.message || '', next = new Date();
      if (/daily/i.test(r)) { next.setHours(24, 1, 0, 0); } else if (/hourly/i.test(r)) { next.setHours(next.getHours() + 1, 1, 0, 0); } else next.setTime(Date.now() + 65e3);
      pausedUntil = next.getTime(); od.retry = pausedUntil;
      queue.unshift(key);
      msg('Open-Meteo usage limit reached – more rain data loads at ' + next.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) + '.');
    } else {
      od.retry = Date.now() + 5 * 60e3;
      msg('Forecast unavailable from Open-Meteo. Retrying in 5 minutes.');
    }
  }).finally(() => { active--; pump(); });
}
function needTiles() {
  // Visible area (+ a small margin) in grid rows/cols -> tile indices
  const pad = 40, corners = [[-pad, -pad], [W + pad, -pad], [-pad, H + pad], [W + pad, H + pad]]
    .map(pt => proj.invert(xf.invert(pt)));
  const lats = corners.map(c => c[1]), lons = corners.map(c => c[0]);
  const r0 = (LAT_MAX - Math.max(...lats)) / STEP, r1 = (LAT_MAX - Math.min(...lats)) / STEP;
  const c0 = (Math.min(...lons) - LON_MIN) / STEP, c1 = (Math.max(...lons) - LON_MIN) / STEP;
  const clampT = (v, n) => Math.max(0, Math.min(n - 1, Math.floor(v)));
  const want = [];
  for (let i = clampT(r0 / TR, TROWS); i <= clampT(r1 / TR, TROWS); i++)
    for (let j = clampT(c0 / TC, TCOLS); j <= clampT(c1 / TC, TCOLS); j++) want.push(i + ',' + j);
  // nearest to the view centre first
  const ci = (r0 + r1) / 2 / TR, cj = (c0 + c1) / 2 / TC;
  want.sort((a, b) => { const [ai, aj] = a.split(',').map(Number), [bi, bj] = b.split(',').map(Number);
    return Math.hypot(ai + .5 - ci, aj + .5 - cj) - Math.hypot(bi + .5 - ci, bj + .5 - cj); });
  for (const key of want) {
    const d = tiles.get(key);
    if (d && (d.state === 'loading' || (d.state === 'ok' && fresh(d)) || (d.state === 'err' && Date.now() < d.retry))) continue;
    if (!d || d.state !== 'ok') {                // try this browser's cache first
      const c = store.get(TILE_KEY + key);
      if (fresh(c)) { tiles.set(key, Object.assign(c, { state:'ok' })); fillTile(key); continue; }
    }
    if (!queue.includes(key)) queue.push(key);
  }
  // drop queued tiles that have scrolled out of view, keep the order nearest-first
  queue.splice(0, queue.length, ...want.filter(k => queue.includes(k)));
  pump();
}
// Drop cached tiles older than 6h and caches from earlier versions
store.keys().forEach(k => {
  if (k.startsWith('rainloop')) store.del(k);
  if (k.startsWith('rt') && !k.startsWith(TILE_KEY)) store.del(k);
  if (k.startsWith(TILE_KEY)) { const c = store.get(k); if (!c || Date.now() - c.at > 6 * 3600e3) store.del(k); }
});

// ---- The chosen place's own forecast (exact point: town label, chart, rain %) ----
let here = null, wetLine = '';
async function loadHere() {
  const key = 'rh6:' + PLACE.slug, c = store.get(key);
  let d = c && covers(c) && Date.now() - c.at < 3600e3 ? c : null;
  if (!d) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${PLACE.lat}&longitude=${PLACE.lon}` +
        '&hourly=precipitation,temperature_2m,weather_code&forecast_hours=' + FETCH_HOURS + '&timeformat=unixtime' + (MODEL ? '&models=' + MODEL : '');
      const res = await fetch(url); if (!res.ok) throw new Error(res.status);
      const hy = (await res.json()).hourly;
      d = { at:Date.now(), t0:hy.time[0], nh:hy.time.length, p:hy.precipitation.map(round1), t:hy.temperature_2m.map(round1), w:hy.weather_code };
      store.keys().filter(k => k.startsWith('rh6:') && k !== key).forEach(k => store.del(k));
      store.set(key, d);
    } catch (e) { d = c; }
  }
  if (!d) return;
  const off = Math.round((base - d.t0) / 3600), sl = a => a.slice(Math.max(0, off), off + HOURS);
  here = { p:sl(d.p), t:sl(d.t), w:sl(d.w) };
  const pct = Math.round(here.p.filter(r => r >= 0.1).length / here.p.length * 100);
  wetLine = pct > 0 ? `${pct}% ${here.w.some(c => c >= 95) ? 'storm' : 'rain'}` : '';
  drawChart(); redraw();
}

// ---- Projection + pan/zoom ----
const svg = d3.select('#map'), worlds = d3.selectAll('.world');
let proj, W, H, land = null, xf = d3.zoomIdentity;
const zoom = d3.zoom().scaleExtent([0.5, 4])
  .on('zoom', e => { xf = e.transform; worlds.attr('transform', xf); buildSamples(); redraw(); })
  .on('end', () => { chooseLabels(); needTiles(); redraw(); });
svg.call(zoom);
function setupProjection() {
  W = innerWidth; H = innerHeight;
  proj = d3.geoMercator().center([PLACE.lon, PLACE.lat]).translate([W / 2, H / 2]).scale(1);
  const view = { type:'MultiPoint', coordinates:[[PLACE.lon - VIEW_LON, PLACE.lat - VIEW_LAT], [PLACE.lon + VIEW_LON, PLACE.lat + VIEW_LAT]] };
  const b = d3.geoPath(proj).bounds(view);
  proj.scale(Math.max(W / (b[1][0] - b[0][0]), H / (b[1][1] - b[0][1])));
  const tl = proj([LON_MIN + STEP, LAT_MAX - STEP]), br = proj([LON_MAX - STEP, LAT_MIN + STEP]);
  proj.clipExtent([[tl[0] - 50, tl[1] - 50], [br[0] + 50, br[1] + 50]]);
  zoom.extent([[0, 0], [W, H]]).translateExtent([tl, br]);
  if (land) { const path = d3.geoPath(proj); svg.select('.land').attr('d', path(land)); svg.select('.coast').attr('d', path(land)); }
  xf = d3.zoomIdentity;
  svg.call(zoom.transform, d3.zoomIdentity);   // fires zoom + end -> samples, labels, tiles
}

// ---- Screen-space sampling: rain is evaluated on a grid of screen points, so detail is independent of zoom ----
let SP = 6, NX = 0, NY = 0, sGX, sGY, OUT, geomVer = 0;
function buildSamples() {
  SP = Math.max(6, Math.sqrt(W * H / 12000));
  NX = Math.ceil(W / SP) + 3; NY = Math.ceil(H / SP) + 3;
  if (!sGX || sGX.length !== NX * NY) { sGX = new Float32Array(NX * NY); sGY = new Float32Array(NX * NY); OUT = new Float32Array(NX * NY); }
  for (let iy = 0, k = 0; iy < NY; iy++) for (let ix = 0; ix < NX; ix++, k++) {
    const [lon, lat] = proj.invert(xf.invert([(ix - 1) * SP, (iy - 1) * SP]));
    sGX[k] = (lon - LON_MIN) / STEP; sGY[k] = (LAT_MAX - lat) / STEP;
  }
  geomVer++;
}
function bilin(g, x, y) {
  x = Math.max(0, Math.min(COLS - 1.001, x)); y = Math.max(0, Math.min(ROWS - 1.001, y));
  const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, i = y0 * COLS + x0;
  return (g[i] * (1 - fx) + g[i + 1] * fx) * (1 - fy) + (g[i + COLS] * (1 - fx) + g[i + COLS + 1] * fx) * fy;
}
const wx = new Float32Array(4), wy = new Float32Array(4);
function bspline(g, x, y) {                    // smooth cubic B-spline (no overshoot) from the coarse grid
  const xi = Math.floor(x), yi = Math.floor(y), tx = x - xi, ty = y - yi;
  const w = (t, a) => { const t2 = t * t, t3 = t2 * t;
    a[0] = (1 - t) * (1 - t) * (1 - t) / 6; a[1] = (3 * t3 - 6 * t2 + 4) / 6; a[2] = (-3 * t3 + 3 * t2 + 3 * t + 1) / 6; a[3] = t3 / 6; };
  w(tx, wx); w(ty, wy);
  let s = 0;
  for (let j = 0; j < 4; j++) {
    const r = Math.max(0, Math.min(ROWS - 1, yi - 1 + j)) * COLS;
    let row = 0;
    for (let i = 0; i < 4; i++) row += wx[i] * g[r + Math.max(0, Math.min(COLS - 1, xi - 1 + i))];
    s += wy[j] * row;
  }
  return s;
}
// Wind displacement (grid cells per hour) at each sample, for the hour pair h -> h+1
let sDX, sDY, dispKey = '';
function ensureDisp(h) {
  const key = h + ':' + geomVer + ':' + dataVer;
  if (key === dispKey) return;
  if (!sDX || sDX.length !== NX * NY) { sDX = new Float32Array(NX * NY); sDY = new Float32Array(NX * NY); }
  const h1 = Math.min(h + 1, HOURS - 1);
  for (let k = 0; k < NX * NY; k++) {
    const x = sGX[k], y = sGY[k], lat = LAT_MAX - y * STEP;
    const u = (bilin(UW[h], x, y) + bilin(UW[h1], x, y)) / 2, v = (bilin(VW[h], x, y) + bilin(VW[h1], x, y)) / 2;
    sDX[k] = u / (111.32 * Math.cos(lat * Math.PI / 180) * STEP);
    sDY[k] = -v / (111.32 * STEP);
  }
  dispKey = key;
}
// For fraction s between hour h and h+1: sample hour h upwind and hour h+1 downwind, then blend
function fieldAt(tt) {
  let h = Math.floor(tt), s = tt - h;
  if (h >= HOURS - 1) { h = HOURS - 1; s = 0; }
  const A = R[h], n = NX * NY;
  if (s < 1e-3) { for (let k = 0; k < n; k++) OUT[k] = bspline(A, sGX[k], sGY[k]); return OUT; }
  ensureDisp(h);
  const B = R[h + 1], s1 = 1 - s;
  for (let k = 0; k < n; k++) {
    const x = sGX[k], y = sGY[k], dx = sDX[k], dy = sDY[k];
    OUT[k] = s1 * bspline(A, x - dx * s, y - dy * s) + s * bspline(B, x + dx * s1, y + dy * s1);
  }
  return OUT;
}
let contourGen = null, contourSize = '';
function contourPath(mp) {
  let s = '';
  for (const poly of mp.coordinates) for (const ring of poly) {
    ring.forEach((p, i) => { s += (i ? 'L' : 'M') + ((p[0] - 1.5) * SP).toFixed(1) + ',' + ((p[1] - 1.5) * SP).toFixed(1); });
    s += 'Z';
  }
  return s;
}

// ---- Town labels: the chosen place, then the biggest towns that fit on screen without overlapping ----
let labels = [];
function chooseLabels() {
  if (!proj) return;
  const scr = p => xf.apply(proj([p.lon, p.lat]));
  const box = (p, [x, y]) => { const w = p.name.length * 7.5 + 14; return { x0:x - w / 2, x1:x + w / 2, y0:y - 26, y1:y + 22 }; };
  const on = ([x, y]) => x > 20 && x < W - 20 && y > 20 && y < H - 20;
  // keep clear of the place name, the clock and the bottom bar
  const zone = el => { const r = el.getBoundingClientRect(); return { x0:r.left - 6, x1:r.right + 6, y0:r.top - 6, y1:r.bottom + 6 }; };
  const barTop = $('legend').getBoundingClientRect().top - 60;
  const taken = [zone($('place')), zone($('clock')), { x0:-1e4, x1:1e4, y0:barTop, y1:1e4 }], out = [], prev = new Set(labels);
  const tryAdd = p => {
    const xy = scr(p); if (p !== PLACE && !on(xy)) return;
    const b = box(p, xy);
    if (p !== PLACE && (b.x0 < 2 || b.x1 > W - 2)) return;
    if (p === PLACE || taken.every(o => b.x1 < o.x0 || b.x0 > o.x1 || b.y1 < o.y0 || b.y0 > o.y1)) { taken.push(b); out.push(p); }
  };
  const max = Math.max(6, Math.round(W * H / 24000));
  tryAdd(PLACE);
  labels.filter(p => p !== PLACE).sort((a, b) => b.pop - a.pop).forEach(p => out.length < max && tryAdd(p));   // keep existing ones stable
  for (const p of PL) { if (out.length >= max) break; if (!p.district && !prev.has(p) && p !== PLACE) tryAdd(p); }
  labels = out;
}

// ---- Drawing ----
let t = 0, playing = true, raf = 0;
const TZ = 'Europe/London';
const fmtParts = new Intl.DateTimeFormat('en-GB', { timeZone:TZ, weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23' });
const partsAt = sec => Object.fromEntries(fmtParts.formatToParts(new Date(sec * 1000)).map(p => [p.type, p.value]));
function redraw() { if (!playing) draw(t); }
function draw(tt) {
  if (!proj || !sGX) return;
  const size = NX + 'x' + NY;
  if (size !== contourSize) { contourGen = d3.contours().size([NX, NY]).smooth(true).thresholds(BANDS.map(b => b[0])); contourSize = size; }
  d3.select('#rain').selectAll('path').data(contourGen(fieldAt(tt))).join('path')
    .attr('fill', (d, i) => BANDS[i][1]).attr('d', contourPath);
  $('scrub').value = tt;
  $('scrub').style.setProperty('--p', (tt / (HOURS - 1) * 100) + '%');
  const when = partsAt(base + Math.round(tt * 6) * 600);
  $('time').textContent = `${when.weekday} ${when.hour}:${when.minute}`;
  const hr = Math.min(HOURS - 1, Math.round(tt)), hp = partsAt(base + hr * 3600), H24 = +hp.hour, h12 = H24 % 12 || 12;
  $('clock').innerHTML = `<span class="num">${h12}</span><small>${H24 < 12 ? 'am' : 'pm'}</small><span class="day">${hp.weekday.toUpperCase()}</span>${wetLine ? `<span class="wet">${wetLine}</span>` : ''}`;
  const g = d3.select('#towns').selectAll('g.town').data(labels, d => d.slug).join(enter => {
    const e = enter.append('g').attr('class', 'town');
    e.append('circle').attr('r', 2.5);
    e.append('text').attr('class', 'name').attr('y', -8);
    e.append('text').attr('class', 'sub').attr('y', 16);
    return e;
  });
  g.attr('transform', d => `translate(${xf.apply(proj([d.lon, d.lat]))})`);
  g.select('.name').text(d => d.name);
  g.select('.sub').text(d => {
    const exact = d === PLACE && here;
    const x = (d.lon - LON_MIN) / STEP, y = (LAT_MAX - d.lat) / STEP;
    const tp = exact ? here.t[hr] : bilin(T[hr], x, y), r = exact ? here.p[hr] : bilin(R[hr], x, y);
    if (!isFinite(tp)) return '';
    return `${Math.round(tp)}°` + (r >= 0.1 ? ` · ${r.toFixed(1)}mm` : '');
  });
}

// ---- Playback ----
let lastTs = 0, lastDraw = 0, hold = 0;
function loop(ts) {
  if (!playing) return;
  const dt = lastTs ? Math.min(ts - lastTs, 200) : 0; lastTs = ts;
  const end = HOURS - 1;
  if (hold > 0) { hold -= dt; if (hold <= 0) t = 0; }
  else { t += dt / HOUR_MS; if (t >= end) { t = end; hold = HOUR_MS * 2; } }
  if (ts - lastDraw >= 1000 / FPS) { draw(t); lastDraw = ts; }
  raf = requestAnimationFrame(loop);
}
function play() {
  cancelAnimationFrame(raf); playing = true; lastTs = 0;
  $('play').textContent = '❚❚'; $('play').setAttribute('aria-label', 'Pause');
  raf = requestAnimationFrame(loop);
}
function pause() {
  cancelAnimationFrame(raf); playing = false;
  $('play').textContent = '▶'; $('play').setAttribute('aria-label', 'Play');
  draw(t);
}
$('play').onclick = () => playing ? pause() : play();
$('scrub').oninput = e => { t = +e.target.value; pause(); };   // read first: pause() redraws and would reset the slider
addEventListener('resize', () => { setupProjection(); drawChart(); });

// ---- Hourly chart along the slider (chosen place): blue = rain, orange = temperature, added together ----
function drawChart() {
  if (!here) return;
  const cv = $('chart'), rain = here.p, temp = here.t;
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineWidth = 4;
  const n = rain.length, tMin = Math.min(...temp), tMax = Math.max(...temp);
  const bottom = h - 3, span = bottom - 2, thumb = 6;
  const bar = (x, v, colour) => {
    ctx.strokeStyle = colour; ctx.beginPath();
    ctx.moveTo(x, bottom); ctx.lineTo(x, bottom - Math.max(0, Math.min(1, v)) * span); ctx.stroke();
  };
  for (let i = 0; i < n; i++) {
    const x = thumb + i / Math.max(1, HOURS - 1) * (w - 2 * thumb);
    bar(x, Math.log1p(rain[i]) / Math.log1p(8), 'rgb(0,150,255)');                           // rain, log scale to 8 mm/h
    bar(x, tMax > tMin ? (temp[i] - tMin) / (tMax - tMin) : 0.5, 'rgb(255,110,0)');        // temp, relative to the day's range
  }
}

// ---- Coastline (Natural Earth 1:10m via world-atlas) ----
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-10m.json')
  .then(r => r.json())
  .then(topo => {
    land = topojson.feature(topo, topo.objects.land);
    const path = d3.geoPath(proj); svg.select('.land').attr('d', path(land)); svg.select('.coast').attr('d', path(land));
  })
  .catch(() => {});

// ---- Location picker ----
let hits = [], sel = 0, pendingUrl = false;
function search(q) {
  const k = norm(q);
  if (k.trim() === '') return PL.slice(0, 100);
  const out = [];
  for (const p of PL) {
    const rank = p.key.startsWith(k) ? 0 : p.key.includes(k) ? 1 : p.key.includes(k.trim()) ? 2 : -1;
    if (rank >= 0) out.push([rank, p]);
  }
  return out.sort((a, b) => a[0] - b[0]).slice(0, 100).map(x => x[1]);   // stable: population order within rank
}
function list() {
  hits = search($('q').value); sel = 0;
  $('results').innerHTML = hits.map((p, i) =>
    `<li role="option" data-i="${i}"${i === sel ? ' class="sel" aria-selected="true"' : ''}>${p.name}${p.near ? `<span>near ${p.near}</span>` : ''}</li>`).join('');
  $('results').scrollTop = 0;
}
function mark(i) {
  sel = Math.max(0, Math.min(hits.length - 1, i));
  [...$('results').children].forEach((li, j) => { li.classList.toggle('sel', j === sel); li.setAttribute('aria-selected', j === sel); });
  $('results').children[sel]?.scrollIntoView({ block:'nearest' });
}
function openPicker() {
  $('picker').classList.add('open'); $('q').value = ''; list(); $('q').focus();
  try { history.pushState({ picker:true }, ''); } catch (e) {}
}
function closePicker(fromPop) {
  if (!$('picker').classList.contains('open')) return;
  $('picker').classList.remove('open');
  if (!fromPop && history.state && history.state.picker) history.back();
}
function choose(p) {
  if (!p) return;
  setPlace(p);
  here = null; wetLine = ''; labels = [];
  const cv = $('chart'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  if (history.state && history.state.picker) { pendingUrl = true; closePicker(); } else { closePicker(true); applyUrl(); }
  setupProjection();
  loadHere();
  t = 0; redraw();
}
$('place').onclick = openPicker;
$('close').onclick = () => closePicker();
$('q').oninput = list;
$('q').onkeydown = e => {
  if (e.key === 'ArrowDown') { mark(sel + 1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { mark(sel - 1); e.preventDefault(); }
  else if (e.key === 'Enter') choose(hits[sel]);
  else if (e.key === 'Escape') closePicker();
};
$('results').onclick = e => { const li = e.target.closest('li'); if (li) choose(hits[+li.dataset.i]); };
addEventListener('popstate', () => { closePicker(true); if (pendingUrl) { pendingUrl = false; applyUrl(); } });

// ---- Hour rollover: shift the window at the top of each hour; refetch tiles once they're 3h old ----
function checkHour() {
  const nb = Math.floor(Date.now() / 3600e3) * 3600;
  if (nb !== base) { base = nb; rebuildAll(); dispKey = ''; loadHere(); }
  if (document.visibilityState === 'visible') needTiles();
}
setInterval(checkHour, 60e3);
document.addEventListener('visibilitychange', checkHour);

// ---- Start ----
setupProjection();
loadHere();
if (matchMedia('(prefers-reduced-motion: reduce)').matches) pause(); else play();
</script>
</body>
